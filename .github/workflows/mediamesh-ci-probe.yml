# Fork-only probe: runs the memory-budget step of run-unit-tests on the
# radio2 branch and reports why a script fails (Actions logs are not readable
# from where this is being debugged). Never part of the upstream PR.
name: MediaMesh CI probe

on:
  push:
    branches: [mediamesh-mqtt-test-build]
  workflow_dispatch:

jobs:
  memory-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mediamesh-mqtt
      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
      - name: Install signed-package verification dependency
        run: |
          python3 -m pip install cryptography
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Memory budgets and nRF52 Bluetooth startup
        env:
          MESHCORE_REQUIRE_ARM_COMPILER: '1'
        run: |
          rc=0
          for t in test_firmware_ram test_sh1106_memory test_recent_repeater_storage test_ota_cold_buffers \
                   test_ota_source_proofs test_neighbor_scope_storage test_ed25519_compact \
                   test_cascade_release_package test_release_publication; do
            if ! python3 -B test/$t.py -v > "$RUNNER_TEMP/$t.log" 2>&1; then
              rc=1
              echo "::error::$t failed"
              { grep -E "^(FAIL|ERROR):|Error|assert|Traceback|line [0-9]+" "$RUNNER_TEMP/$t.log" | tail -n 4; tail -n 4 "$RUNNER_TEMP/$t.log"; } \
                | cut -c1-300 | while IFS= read -r l; do echo "::error::$t: ${l//%/%25}"; done
            fi
          done
          exit $rc
