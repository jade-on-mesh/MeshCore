# Test builds for the radio2 (MediaMesh) MQTT tagging branch, on Jade's fork
# only: never part of the upstream PR. Builds the Station G2 observers (plus a
# non-MQTT repeater as a compile check) and uploads them as artifacts.
name: MediaMesh MQTT test build

on:
  push:
    branches: [mediamesh-mqtt-test-build, mediamesh-base-test-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - ikoka_stick_nrf_30dbm_repeater
    steps:
      - uses: actions/checkout@v4
      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
      - name: Build ${{ matrix.target }}
        run: |
          set -o pipefail
          if ! /usr/bin/env bash build.sh build-firmware ${{ matrix.target }} 2>&1 | tee build.log; then
            # Surface compiler errors as annotations (readable without the log).
            { grep -n -iE "error|fail|exceed|overflow|budget|too large|region .* overflowed" build.log out/build-logs/*.log 2>/dev/null | grep -v "^.*Compiling" | cut -c1-400 | tail -n 9 || true; } | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          fi
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out
