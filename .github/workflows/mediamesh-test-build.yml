# Test builds for the radio2 (MediaMesh) MQTT tagging branch, on Jade's fork
# only: never part of the upstream PR. Builds the Station G2 observers (plus a
# non-MQTT repeater as a compile check) and uploads them as artifacts.
name: MediaMesh MQTT test build

on:
  push:
    branches: [mediamesh-mqtt-test-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - ikoka_stick_nrf_30dbm_repeater
    steps:
      - uses: actions/checkout@v4
      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
      - name: Build ${{ matrix.target }}
        run: |
          set -o pipefail
          if ! /usr/bin/env bash build.sh build-firmware ${{ matrix.target }} --firmware-version v1.18.0.1-halo-keymind-cascade-dev-mediamesh --radio-preset usa-cascade-fixed --profile cascade --require-ota 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # Surface compiler errors as annotations (readable without the log).
            { grep -n -iE "error|fail|exceed|overflow|budget|too large|refus|limit|bytes" "$RUNNER_TEMP/build.log" out/build-logs/*.log 2>/dev/null | grep -v "Compiling" | cut -c1-300 | tail -n 9 || true; } | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          fi
      - name: Report package sizes
        if: always()
        run: |
          ls -l out | tail -n +2 | while read -r l; do echo "::notice::$l"; done
          for z in out/*.zip; do [ -f "$z" ] || continue; unzip -l "$z" | tail -n +4 | head -n -2 | while read -r l; do echo "::notice::$(basename "$z"): $l"; done; done
          grep -h -iE "application limit|OTA image is|Flash: \[|RAM:   \[" "$RUNNER_TEMP/build.log" | tail -n 6 | while read -r l; do echo "::notice::$l"; done
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out

  # Compile and size checks: the shared dispatcher change must still fit the
  # RAK4631 Full Companion, and the hook must build for ESP32 repeaters,
  # room servers and the MQTT observers.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - RAK_4631_companion_radio_full
          - Station_G2_repeater_observer_mqtt
          - Station_G2_room_server_observer_mqtt
          - Heltec_v3_repeater
    steps:
      - uses: actions/checkout@v4
      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
      - name: Build ${{ matrix.target }}
        run: |
          set -o pipefail
          if ! /usr/bin/env bash build.sh build-firmware ${{ matrix.target }} 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            { grep -n -iE "error|fail|exceed|overflow|budget|too large|refus|limit|bytes" "$RUNNER_TEMP/build.log" out/build-logs/*.log 2>/dev/null | grep -v "Compiling" | cut -c1-300 | tail -n 9 || true; } | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          fi
      - name: Report sizes
        if: always()
        run: |
          grep -h -iE "application limit|Flash: \[|RAM:   \[|bytes free|remaining" "$RUNNER_TEMP/build.log" | tail -n 6 | while read -r l; do echo "::notice::$l"; done
