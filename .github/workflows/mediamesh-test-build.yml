# Test builds for the radio2 (MediaMesh) MQTT tagging branch, on Jade's fork
# only: never part of the upstream PR. Builds the Station G2 observers (plus a
# non-MQTT repeater as a compile check) and uploads them as artifacts.
name: MediaMesh MQTT test build

on:
  push:
    branches: [mediamesh-mqtt-test-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - Station_G2_repeater_observer_mqtt
          - Station_G2_room_server_observer_mqtt
          - Heltec_v3_repeater
          - Station_G3_ESP32_repeater_observer_mqtt
          - Station_G3_ESP32_r2_repeater_observer_mqtt
          - ikoka_stick_nrf_30dbm_repeater
    steps:
      - uses: actions/checkout@v4
      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
      - name: Build ${{ matrix.target }}
        run: |
          set -o pipefail
          if ! /usr/bin/env bash build.sh build-firmware ${{ matrix.target }} 2>&1 | tee build.log; then
            # Surface compiler errors as annotations (readable without the log).
            { grep -E "error:|Error |undefined reference|\*\*\*" build.log | head -30 || true; for f in out/build-logs/*.log; do grep -E "error|overflow|Error" "$f" | head -20 || true; tail -n 25 "$f"; done; } | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          fi
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out
